name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # кнопка «Опубликовать изменения» в админке (/admin/, Sveltia CMS): правки из админки коммитятся с [skip ci],
  # сайт пересобирается одним запуском по этой кнопке
  repository_dispatch:
    types: [sveltia-cms-publish]
permissions:
  contents: write   # сохранение карты адресов, переадресаций и сжатых фото после сборки
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # фото, загруженные в админке: до 1600 px, сжатие (уже сжатые пропускаются)
      - run: node scripts/optimize-uploads.mjs
      # prebuild: конфиг админки + проверка данных (ошибка = сайт не обновится, причина в логе и в /admin/seo/)
      # postbuild: карта адресов, переадресации, SEO-отчёт
      # сквозной тест админки (правки, новые страницы, переадресации, ошибки редактора) — только при изменении кода, не при публикации из админки
      - name: Admin end-to-end test
        if: github.event_name == 'push'
        run: npm run test:admin
      - run: npm run build
      - run: npm run qa
      - name: Save URL map, redirects and compressed photos
        run: |
          if [ -n "$(git status --porcelain -- src/cms/settings public/images/uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src/cms/settings
            # папки загрузок может не быть: Sveltia убирает .gitkeep, а после удаления последнего фото папка пропадает из git
            if [ -d public/images/uploads ]; then git add -A public/images/uploads; fi
            git commit -m "Карта адресов, переадресации, сжатые фото [skip ci]"
            git pull --rebase --autostash origin main && git push origin HEAD:main || { echo "::error::карта адресов не сохранена в репозиторий"; exit 1; }
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
